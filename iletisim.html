    <!-- 1. NATIVE JAVASCRIPT DENETİM KODLARI -->
    <script>
        function nativeJsDenetle() {
            let hatalar = [];
            
            // DOM üzerinden elemanları ID ile yakalama
            let ad = document.getElementById('ad').value.trim();
            let soyad = document.getElementById('soyad').value.trim();
            let email = document.getElementById('email').value.trim();
            let telefon = document.getElementById('telefon').value.trim();
            let cinsiyet = document.querySelector('input[name="cinsiyet"]:checked');
            let konu = document.getElementById('konu').value;
            let mesaj = document.getElementById('mesaj').value.trim();
            let onay = document.getElementById('onay').checked;

            // Boşluk Kontrolleri
            if (ad === "") hatalar.push("Ad alanı boş bırakılamaz.");
            if (soyad === "") hatalar.push("Soyad alanı boş bırakılamaz.");
            if (mesaj === "") hatalar.push("Mesaj alanı boş bırakılamaz.");
            if (konu === "") hatalar.push("Lütfen bir konu seçiniz.");
            if (!cinsiyet) hatalar.push("Lütfen cinsiyet (Radio) seçiniz.");
            if (!onay) hatalar.push("Sözleşme onayı (Checkbox) işaretlenmelidir.");

            // Email Format Kontrolü (Regex)
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === "") {
                hatalar.push("E-Posta alanı boş bırakılamaz.");
            } else if (!emailRegex.test(email)) {
                hatalar.push("Geçersiz e-posta formatı.");
            }

            // Telefon Format Kontrolü (11 haneli ve 0 ile başlamalı)
            let telRegex = /^0[0-9]{10}$/;
            if (telefon === "") {
                hatalar.push("Telefon alanı boş bırakılamaz.");
            } else if (!telRegex.test(telefon)) {
                hatalar.push("Telefon 0 ile başlamalı ve 11 haneli olmalıdır.");
            }

            // Sonuçları Ekrana Yazdırma
            let hataKutusu = document.getElementById('hataKutusu');
            if (hatalar.length > 0) {
                hataKutusu.innerHTML = "<strong>Native JS Hataları:</strong><br>" + hatalar.join("<br>");
                hataKutusu.classList.remove('d-none');
                hataKutusu.classList.replace('alert-success', 'alert-danger');
            } else {
                hataKutusu.innerHTML = "<strong>Native JS:</strong> Form başarıyla doğrulandı ve gönderilmeye hazır!";
                hataKutusu.classList.remove('d-none');
                hataKutusu.classList.replace('alert-danger', 'alert-success');
            }
        }
    </script>

    <!-- 2. VUE.JS DENETİM KODLARI (Framework) -->
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // v-model ile HTML'e bağlanan değişkenler
                    form: {
                        ad: '',
                        soyad: '',
                        email: '',
                        telefon: '',
                        cinsiyet: null,
                        konu: '',
                        mesaj: '',
                        onay: false
                    }
                }
            },
            methods: {
                vueJsDenetle() {
                    let hatalar = [];
                    
                    // State üzerinden boşluk kontrolleri
                    if (!this.form.ad.trim()) hatalar.push("Ad alanı boş bırakılamaz.");
                    if (!this.form.soyad.trim()) hatalar.push("Soyad alanı boş bırakılamaz.");
                    if (!this.form.mesaj.trim()) hatalar.push("Mesaj alanı boş bırakılamaz.");
                    if (!this.form.konu) hatalar.push("Lütfen bir konu seçiniz.");
                    if (!this.form.cinsiyet) hatalar.push("Lütfen cinsiyet (Radio) seçiniz.");
                    if (!this.form.onay) hatalar.push("Sözleşme onayı (Checkbox) işaretlenmelidir.");

                    // Email Regex
                    let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!this.form.email.trim()) {
                        hatalar.push("E-Posta alanı boş bırakılamaz.");
                    } else if (!emailRegex.test(this.form.email)) {
                        hatalar.push("Geçersiz e-posta formatı.");
                    }

                    // Telefon Regex
                    let telRegex = /^0[0-9]{10}$/;
                    if (!this.form.telefon.trim()) {
                        hatalar.push("Telefon alanı boş bırakılamaz.");
                    } else if (!telRegex.test(this.form.telefon)) {
                        hatalar.push("Telefon 0 ile başlamalı ve 11 haneli olmalıdır.");
                    }

                    // Sonuçları Ekrana Yazdırma (Vue ile klasik DOM manipülasyonu hocanın iki farkı görmesi için iyidir)
                    let hataKutusu = document.getElementById('hataKutusu');
                    if (hatalar.length > 0) {
                        hataKutusu.innerHTML = "<strong>Vue.js Hataları:</strong><br>" + hatalar.join("<br>");
                        hataKutusu.classList.remove('d-none');
                        hataKutusu.classList.replace('alert-success', 'alert-danger');
                    } else {
                        hataKutusu.innerHTML = "<strong>Vue.js:</strong> Form başarıyla doğrulandı ve gönderilmeye hazır!";
                        hataKutusu.classList.remove('d-none');
                        hataKutusu.classList.replace('alert-danger', 'alert-success');
                    }
                }
            }
        }).mount('#iletisim-app');
    </script>
